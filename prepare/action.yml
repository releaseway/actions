name: Prepare Releaseway release
description: Plan a version series, prepare its configured source tag or release commit, resume a saved plan, or verify an existing release tag.
inputs:
  allow-prerelease:
    description: Allow prerelease tags in read-only resolve mode; false by default.
    default: "false"
  tag-prefix:
    description: Optional exact prefix for resolve; empty accepts unambiguous SemVer suffixes.
    default: ""
  mode:
    description: plan, prepare, resume, resolve, or tag. Resolve verifies an existing stable tag; tag creates or verifies an explicit tag binding.
    default: prepare
  release-config:
    description: Repository-relative release policy path. Not required for resolve.
    default: .github/releaseway.yml
  prerelease-id:
    description: Optional prerelease identifier such as rc or beta.
    default: ""
  plan-path:
    description: Saved plan path for resume; defaults to a file in RUNNER_TEMP.
    default: ""
  tag:
    description: Existing versioned tag for resolve (stable unless allow-prerelease is true), or explicit tag for tag mode.
    default: ""
  commit:
    description: Full commit SHA for tag mode, or optional expected tag commit for resolve.
    default: ""
  branch:
    description: Origin branch for resolve mode.
    default: main
outputs:
  tag:
    value: ${{ steps.prepare.outputs.tag }}
    description: Release tag.
  version:
    value: ${{ steps.prepare.outputs.version }}
    description: Exact release version.
  commit:
    value: ${{ steps.prepare.outputs.commit }}
    description: Exact release commit SHA.
  target:
    value: ${{ steps.prepare.outputs.target }}
    description: Existing tag commit in resolve mode.
  source:
    value: ${{ steps.prepare.outputs.source }}
    description: Original source SHA; equal to commit for source-tag strategy.
  plan-path:
    value: ${{ steps.prepare.outputs.plan-path }}
    description: Saved plan for inspection or resume, including when push fails.
  latest:
    value: ${{ steps.prepare.outputs.latest }}
    description: Configured GitHub latest policy.
  prerelease:
    value: ${{ steps.prepare.outputs.prerelease }}
    description: Whether the prepared release is a prerelease.
  state:
    value: ${{ steps.prepare.outputs.state }}
    description: planned or existing.
  diagnostics-path:
    description: Runner-local versioned diagnostics JSON, separate from existing reports; available on controlled failures when writable.
    value: ${{ steps.prepare.outputs.diagnostics-path }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
    - id: prepare
      shell: bash
      env:
        INPUT_ALLOW_PRERELEASE: ${{ inputs.allow-prerelease }}
        INPUT_TAG_PREFIX: ${{ inputs.tag-prefix }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_RELEASE_CONFIG: ${{ inputs.release-config }}
        INPUT_PRERELEASE_ID: ${{ inputs.prerelease-id }}
        INPUT_PLAN_PATH: ${{ inputs.plan-path }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_COMMIT: ${{ inputs.commit }}
        INPUT_BRANCH: ${{ inputs.branch }}
      run: node "$GITHUB_ACTION_PATH/../dist/engine.cjs" release-prepare
