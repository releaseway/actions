name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable SemVer tag to publish.
        required: true
        type: string
      acceptance-runs:
        description: Successful exact-candidate fixture run IDs, comma-separated
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release tag
        id: release
        uses: ./prepare
        with:
          mode: resolve
          tag: ${{ inputs.tag }}

      - name: Checkout tagged release action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.target }}
          path: release-action
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Verify tagged action
        working-directory: release-action
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run check:dist
          python3 test/release.py

      - name: Verify exact-candidate CI and acceptance evidence
        env:
          GH_TOKEN: ${{ secrets.RELEASEWAY_EVIDENCE_TOKEN || github.token }}
          CANDIDATE: ${{ steps.release.outputs.target }}
          ACCEPTANCE_RUNS: ${{ inputs.acceptance-runs }}
        run: |
          python3 scripts/verify-release-evidence.py \
            --repository "$GITHUB_REPOSITORY" \
            --candidate "$CANDIDATE" \
            --acceptance-runs "$ACCEPTANCE_RUNS"

      - name: Publish immutable action release
        id: publish
        uses: ./release-action
        with:
          tag: ${{ steps.release.outputs.tag }}
          commit: ${{ steps.release.outputs.target }}
          title: ${{ steps.release.outputs.tag }}
          notes: standard
          latest: "true"

      - name: Summary
        run: |
          {
            echo "### actions ${{ steps.release.outputs.tag }}"
            echo ""
            echo "- state: ${{ steps.publish.outputs.state }}"
            echo "- notes: ${{ steps.publish.outputs.notes-state }}"
            echo "- release: ${{ steps.publish.outputs.release-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
