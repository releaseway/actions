name: Prepare distribution files
description: Select and verify files into a new directory for any static host.
inputs:
  files:
    description: Newline-separated relative files, directories, or glob patterns.
    required: true
  root:
    description: Optional local root; retains paths relative to this directory.
    required: false
  max-file-bytes:
    description: Maximum bytes per file (default 1 GiB; at most 8 GiB).
    required: false
  max-total-bytes:
    description: Maximum output bytes (default 2 GiB; at most 8 GiB).
    required: false
outputs:
  path:
    description: Completed directory for a subsequent deployment step.
  report:
    description: Separate JSON file inventory and verification report.
  digest:
    description: SHA-256 identity of final paths, sizes, and file hashes.
runs:
  using: node24
  main: ../dist/distribute.cjs
