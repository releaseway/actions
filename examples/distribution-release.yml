name: Prepare exact public Release files
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published tag in this repository with an install.sh asset
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - id: distribution
        uses: releaseway/actions/distribute@1c0b9237f61ee66f68db880963ec03da46c8a6ed # v0.5.0
        with:
          tag: ${{ inputs.tag }}
          files: install.sh
      - name: Read verified file report
        env:
          DISTRIBUTION_REPORT: ${{ steps.distribution.outputs.report }}
        run: test -s "$DISTRIBUTION_REPORT"
