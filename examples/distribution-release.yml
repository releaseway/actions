name: Prepare exact public Release files

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published tag in this repository with an install.sh asset
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04

    steps:
      - id: distribution
        uses: releaseway/actions/distribute@2abdf26c6f01c1e49da4ba5d85253847fe721fd9 # v0.6.3
        with:
          tag: ${{ inputs.tag }}
          files: install.sh

      - name: Read verified file report
        env:
          DISTRIBUTION_REPORT: ${{ steps.distribution.outputs.report }}
        run: test -s "$DISTRIBUTION_REPORT"
