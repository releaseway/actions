name: Prepare generic files

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Replace this sample producer with your existing build step.
      - name: Produce sample files
        run: |
          mkdir -p dist
          printf '#!/bin/sh\nprintf "ready\\n"\n' > dist/diagnose.sh
          printf '{"schema":1}\n' > dist/metadata.json

      - id: distribution
        uses: releaseway/actions/distribute@ffbe66ca35cbd7edcd6a10806228db76b6a84baf # v0.7.0
        with:
          files: dist/*

      - name: Consume with any existing host tool
        env:
          DISTRIBUTION_PATH: ${{ steps.distribution.outputs.path }}
          DISTRIBUTION_REPORT: ${{ steps.distribution.outputs.report }}
        run: |
          cmp dist/diagnose.sh "$DISTRIBUTION_PATH/diagnose.sh"
          cmp dist/metadata.json "$DISTRIBUTION_PATH/metadata.json"
          test -s "$DISTRIBUTION_REPORT"
          # Your existing upload command consumes DISTRIBUTION_PATH.
