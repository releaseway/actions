name: Publish latest public Release files to Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write
jobs:
  distribute:
    # Enable Pages in Actions mode and allow this caller ref in github-pages.
    # The caller repository's latest stable Release must contain install.sh.
    uses: releaseway/actions/.github/workflows/distribute-pages.yml@2abdf26c6f01c1e49da4ba5d85253847fe721fd9 # v0.6.3
    with:
      files: install.sh
