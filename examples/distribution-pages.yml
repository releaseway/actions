name: Publish latest public Release files to Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write
jobs:
  distribute:
    # Enable Pages in Actions mode and allow this caller ref in github-pages.
    # The caller repository's latest stable Release must contain install.sh.
    uses: releaseway/actions/.github/workflows/distribute-pages.yml@1c0b9237f61ee66f68db880963ec03da46c8a6ed # v0.5.0
    with:
      files: install.sh
