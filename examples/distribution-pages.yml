name: Publish latest public Release files to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write

jobs:
  distribute:
    # Enable Pages in Actions mode and allow this caller ref in github-pages.
    # The caller repository's latest stable Release must contain install.sh.
    uses: releaseway/actions/.github/workflows/distribute-pages.yml@ffbe66ca35cbd7edcd6a10806228db76b6a84baf # v0.7.0
    with:
      files: install.sh
