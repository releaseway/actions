name: Publish latest public Release files to Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write
jobs:
  distribute:
    # Consumers pin releaseway/actions/.github/workflows/distribute-pages.yml to a full SHA.
    uses: ./.github/workflows/distribute-pages.yml
    with:
      files: install.sh
