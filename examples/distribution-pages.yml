name: Publish latest public Release files to Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write
jobs:
  distribute:
    # Enable Pages in Actions mode and allow this caller ref in github-pages.
    # The caller repository's latest stable Release must contain install.sh.
    uses: releaseway/actions/.github/workflows/distribute-pages.yml@7427110b565bedef79ab0f80e6821a706d7f21ed # v0.5.1
    with:
      files: install.sh
