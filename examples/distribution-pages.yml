name: Publish latest public Release files to Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write
jobs:
  distribute:
    # Enable Pages in Actions mode and allow this caller ref in github-pages.
    # The caller repository's latest stable Release must contain install.sh.
    uses: releaseway/actions/.github/workflows/distribute-pages.yml@1b1d72999b59f03d334845f5accb982c38f4afe1 # v0.6.1
    with:
      files: install.sh
