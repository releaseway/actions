name: Publish documentation and versioned Release assets to Pages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.site.outputs.artifact-id }}
    steps:
      - name: Build sample documentation
        run: |
          mkdir -p website/dist/.well-known
          printf '<!doctype html><title>Downloads</title>\n' > website/dist/index.html
          printf '{"site":"documentation"}\n' > website/dist/.well-known/site.json
      - id: site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-${{ github.run_id }}-${{ github.run_attempt }}
          path: website/dist
          include-hidden-files: true
          if-no-files-found: error
  distribute:
    needs: documentation
    permissions:
      contents: read
      actions: read
      deployments: read
      pages: write
      id-token: write
    # Enable Pages in Actions mode and allow this ref in github-pages.
    # Check in the sample JSON policy as .github/distribution/release-set.json;
    # publish its named assets on the repository's v1.x Releases first.
    # Unreleased schema 2 candidate; v0.6.3 does not support these inputs.
    uses: releaseway/actions/.github/workflows/distribute-pages.yml@6f2d04d9c825e1efaed1a9089dc02be22ddef627
    with:
      config: .github/distribution/release-set.json
      site-artifact-id: ${{ needs.documentation.outputs.artifact-id }}
