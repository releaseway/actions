name: Publish immutable GitHub release
description: Create or verify an immutable GitHub Release from caller-produced artifacts.

inputs:
  tag:
    description: Existing Git tag to publish.
    required: true
  commit:
    description: Full 40-character commit SHA the remote tag must resolve to.
    required: true
  assets:
    description: Optional newline-separated asset paths or glob patterns. Every pattern must match at least one regular file.
    required: false
    default: ""
  upload-concurrency:
    description: Maximum simultaneous asset uploads, from 1 to 8. Failed uploads leave a resumable draft.
    required: false
    default: "1"
  title:
    description: Release title. Defaults to the tag.
    required: false
    default: ""
  notes:
    description: "Release notes mode or preset: standard, compact, conventional, changelog, detailed, scoped, pull-requests, hybrid, github, file, or none."
    required: false
    default: standard
  notes-config:
    description: Optional path to a versioned release-notes configuration file.
    required: false
    default: ""
  notes-file:
    description: Release notes body file. Required only when notes is file.
    required: false
    default: ""
  notes-existing:
    description: "Existing release body policy: auto, verify, or preserve."
    required: false
    default: auto
  notes-preview:
    description: Prepare and validate release notes without mutating release state.
    required: false
    default: "false"
  prerelease:
    description: Publish as a prerelease.
    required: false
    default: "false"
  latest:
    description: "Latest-release policy: automatic, true, false, or current-series."
    required: false
    default: automatic
  release-config:
    description: Repository-relative version-series policy used when latest is current-series.
    default: .github/releaseway.yml
  token:
    description: GitHub token override. Defaults to caller github.token; use a repository-write, workflow-authorized credential when the release target changes .github/workflows.
    required: false
    default: ""

outputs:
  state:
    description: created, resumed-draft, existing, or preview.
    value: ${{ steps.release.outputs.state }}
  release-url:
    description: Published GitHub Release URL. Empty in preview mode.
    value: ${{ steps.release.outputs.release-url }}
  notes-path:
    description: Local path to the prepared or observed release notes body.
    value: ${{ steps.release.outputs.notes-path }}
  notes-report:
    description: Local path to the versioned release-notes diagnostics report.
    value: ${{ steps.release.outputs.notes-report }}
  notes-state:
    description: prepared, verified, or preserved.
    value: ${{ steps.release.outputs.notes-state }}

runs:
  using: composite
  steps:
    - name: Set up Node.js 24
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24"
    - id: release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token != '' && inputs.token || github.token }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_COMMIT: ${{ inputs.commit }}
        INPUT_ASSETS: ${{ inputs.assets }}
        INPUT_UPLOAD_CONCURRENCY: ${{ inputs.upload-concurrency }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_NOTES: ${{ inputs.notes }}
        INPUT_NOTES_CONFIG: ${{ inputs.notes-config }}
        INPUT_NOTES_FILE: ${{ inputs.notes-file }}
        INPUT_NOTES_EXISTING: ${{ inputs.notes-existing }}
        INPUT_NOTES_PREVIEW: ${{ inputs.notes-preview }}
        INPUT_PRERELEASE: ${{ inputs.prerelease }}
        INPUT_LATEST: ${{ inputs.latest }}
        INPUT_RELEASE_CONFIG: ${{ inputs.release-config }}
      run: node "$GITHUB_ACTION_PATH/dist/main.cjs"
